name: Build Docker on Release

on:
  release:
    types: [published]

jobs:
  # Native builds in parallel
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            digest_name: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest_name: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Push by digest only; the merge job tags :latest and the release tag
          outputs: type=image,name=ghcr.io/valhalla-development/snatchr,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=snatchr-${{ matrix.digest_name }}
          cache-to: type=gha,mode=max,scope=snatchr-${{ matrix.digest_name }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.digest_name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/valhalla-development/snatchr:${{ github.event.release.tag_name }}" \
            -t "ghcr.io/valhalla-development/snatchr:latest" \
            $(printf 'ghcr.io/valhalla-development/snatchr@sha256:%s ' *)
